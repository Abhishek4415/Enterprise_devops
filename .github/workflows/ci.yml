name: CI Pipeline

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Run integration tests
        run: npm run test:integration

  deploy:
    needs: test          # Key: must wait for test to pass before deploy can run
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        run: echo "Deploying to production..."