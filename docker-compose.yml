services:
  app-blue:
    build: ./app
    environment:
      APP_VERSION: v1
      APP_COLOR: blue
    container_name: app-blue

  app-green:
    build: ./app
    environment:
      APP_VERSION: v2
      APP_COLOR: green
    container_name: app-green

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app-blue
      - app-green